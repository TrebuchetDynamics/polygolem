name: Deploy Docs Site

# Publishes the Astro/Starlight docs site to Cloudflare Pages on every main push
# that touches the site source. Gated on the CLOUDFLARE_API_TOKEN secret: if it
# is not configured the job succeeds without deploying, so a fork or an
# un-provisioned repo is never blocked. Manual runs are available via
# workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - "docs/docs-site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for deploy credentials
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping deploy (build is validated by ci.yml)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/docs-site/package-lock.json
      - name: Install
        if: steps.guard.outputs.deploy == 'true'
        run: npm --prefix docs/docs-site ci
      - name: Build and deploy to Cloudflare Pages
        if: steps.guard.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm --prefix docs/docs-site run deploy
