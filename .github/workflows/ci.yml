name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/docs-site/package-lock.json
      - run: npm --prefix docs/docs-site ci
      - run: npm --prefix docs/docs-site run build

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format Go files
        run: |
          tmp="$(mktemp)"
          git ls-files -z '*.go' ':!:opensource-projects/**' > "$tmp"
          if [ -s "$tmp" ]; then
            xargs -0 gofmt -w < "$tmp"
          fi
          rm "$tmp"
      - run: git diff --exit-code
      - run: go vet ./...
      # -short skips live-network e2e tests (tests/*_test.go) so CI does not
      # depend on third-party API availability or live data quirks.
      - run: go test -short ./...
      # Race detector pass to catch concurrency regressions in the streaming,
      # transport, and circuit-breaker code (CGO required; enabled by default).
      - run: go test -race -short ./...
      - name: Coverage
        run: |
          go test -short -coverprofile=coverage.out ./...
          coverage=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${coverage}%"
          min=60
          if awk "BEGIN { exit !(${coverage} < ${min}) }"; then
            echo "FAIL: coverage ${coverage}% is below minimum ${min}%"
            exit 1
          fi
